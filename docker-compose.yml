services:

  mongo:
    image: mongo:5.0
    container_name: mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    image: princeohlyan09/chat_back:latest
    container_name: chat_back
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/chatapp
    depends_on:
      - mongo

  frontend:
    image: princeohlyan09/chatfront:latest
    container_name: chat_front
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data: